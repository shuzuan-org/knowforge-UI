<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" fill="none" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9fc"/>
      <stop offset="1" stop-color="#f3f1f9"/>
    </linearGradient>
    <linearGradient id="nodeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b6fd6"/>
      <stop offset="1" stop-color="#8047CC"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1080" height="360" rx="16" fill="url(#bg)"/>

  <!-- ===== Panel 1: 原始资料 ===== -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="60" width="280" height="240" rx="14" fill="#fff" stroke="#e0dde8"/>
    <!-- stacked doc icons -->
    <rect x="85" y="110" width="80" height="100" rx="6" fill="#fff" stroke="#d4cde8" stroke-width="1.5"/>
    <rect x="98" y="120" width="54" height="5" rx="2.5" fill="#ece8f3"/>
    <rect x="98" y="134" width="54" height="5" rx="2.5" fill="#ece8f3"/>
    <rect x="98" y="148" width="38" height="5" rx="2.5" fill="#ece8f3"/>
    <rect x="98" y="162" width="54" height="5" rx="2.5" fill="#ece8f3"/>
    <rect x="98" y="176" width="44" height="5" rx="2.5" fill="#ece8f3"/>
    <rect x="175" y="125" width="80" height="100" rx="6" fill="#fff" stroke="#d4cde8" stroke-width="1.5"/>
    <rect x="188" y="135" width="54" height="5" rx="2.5" fill="#ece8f3"/>
    <rect x="188" y="149" width="54" height="5" rx="2.5" fill="#ece8f3"/>
    <rect x="188" y="163" width="38" height="5" rx="2.5" fill="#ece8f3"/>
    <rect x="188" y="177" width="54" height="5" rx="2.5" fill="#ece8f3"/>
    <rect x="188" y="191" width="44" height="5" rx="2.5" fill="#ece8f3"/>
    <text x="180" y="265" text-anchor="middle" font-size="14" font-weight="600" fill="#8047CC" opacity="0.6">原始资料</text>
  </g>

  <!-- Arrow 1 -->
  <g opacity="0.35">
    <line x1="320" y1="180" x2="380" y2="180" stroke="#8047CC" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="380,180 372,176 372,184" fill="#8047CC"/>
  </g>

  <!-- ===== Panel 2: 抽取实体与关系 ===== -->
  <g filter="url(#cardShadow)">
    <rect x="390" y="60" width="280" height="240" rx="14" fill="#fff" stroke="#d4cde8"/>
    <!-- 3 connected nodes -->
    <circle cx="480" cy="150" r="16" fill="url(#nodeG)" filter="url(#nodeShadow)"/>
    <circle cx="570" cy="130" r="16" fill="url(#nodeG)" filter="url(#nodeShadow)"/>
    <circle cx="570" cy="200" r="16" fill="url(#nodeG)" filter="url(#nodeShadow)"/>
    <line x1="480" y1="150" x2="570" y2="130" stroke="#c4b8e0" stroke-width="2.5"/>
    <line x1="480" y1="150" x2="570" y2="200" stroke="#c4b8e0" stroke-width="2.5"/>
    <line x1="570" y1="130" x2="570" y2="200" stroke="#c4b8e0" stroke-width="2.5"/>
    <!-- small extraction sparks -->
    <circle cx="510" cy="105" r="3" fill="#8047CC" opacity="0.3"/>
    <circle cx="540" cy="175" r="2.5" fill="#8047CC" opacity="0.2"/>
    <circle cx="445" cy="185" r="2" fill="#8047CC" opacity="0.25"/>
    <text x="530" y="265" text-anchor="middle" font-size="14" font-weight="600" fill="#8047CC" opacity="0.6">抽取实体与关系</text>
  </g>

  <!-- Arrow 2 -->
  <g opacity="0.35">
    <line x1="670" y1="180" x2="730" y2="180" stroke="#8047CC" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="730,180 722,176 722,184" fill="#8047CC"/>
  </g>

  <!-- ===== Panel 3: 知识图谱 ===== -->
  <g filter="url(#cardShadow)">
    <rect x="740" y="60" width="300" height="240" rx="14" fill="#fff" stroke="#e0dde8"/>
    <!-- clean graph: 5 abstract nodes, minimal edges -->
    <line x1="850" y1="130" x2="950" y2="110" stroke="#d4cde8" stroke-width="2.5"/>
    <line x1="850" y1="130" x2="830" y2="230" stroke="#d4cde8" stroke-width="2.5"/>
    <line x1="950" y1="110" x2="980" y2="200" stroke="#d4cde8" stroke-width="2.5"/>
    <line x1="830" y1="230" x2="980" y2="200" stroke="#d4cde8" stroke-width="2.5"/>
    <circle cx="850" cy="130" r="18" fill="url(#nodeG)" filter="url(#nodeShadow)"/>
    <circle cx="950" cy="110" r="14" fill="url(#nodeG)" filter="url(#nodeShadow)" opacity="0.8"/>
    <circle cx="980" cy="200" r="13" fill="url(#nodeG)" filter="url(#nodeShadow)" opacity="0.7"/>
    <circle cx="830" cy="230" r="13" fill="url(#nodeG)" filter="url(#nodeShadow)" opacity="0.7"/>
    <!-- breathing pulse -->
    <circle cx="850" cy="130" r="18" fill="none" stroke="#8047CC" stroke-width="1.5" opacity="0.2">
      <animate attributeName="r" values="18;28;18" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="890" y="265" text-anchor="middle" font-size="14" font-weight="600" fill="#8047CC" opacity="0.6">知识图谱</text>
  </g>
</svg>
