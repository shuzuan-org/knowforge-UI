<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KnowForge · 企业知识编译器</title>
<meta name="description" content="KnowForge 企业知识编译器：将文件、规则与经验组织为可执行的知识系统。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260729-purple">
<script>
  (function(){
    try{
      var theme=localStorage.getItem("kf-theme");
      if(theme==="dark"||theme==="light")document.documentElement.setAttribute("data-theme",theme);
    }catch(e){}
  })();
</script>
<style>
:root{
  --primary:#8A4ED1;
  --primary-deep:#4B2DB5;
  --primary-structure:#3B2673;
  --primary-soft:#E9E6FF;
  --primary-highlight:#B35BE8;
  --canvas:#FFFFFF;
  --canvas-soft:#F7F8FA;
  --panel:#FFFFFF;
  --hairline:#D9DCE3;
  --ink:#0F1115;
  --text-secondary:#5F5C56;
  --text-muted:#86868B;
  --text-placeholder:#8D8981;
  --success:#4C9A72;
  --warning:#C99A45;
  --error:#C85A5A;
  --font:Inter,"Noto Sans SC",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Consolas,monospace;
  --r-input:8px;
  --r-button:12px;
  --r-card:16px;
  --r-modal:24px;
  --r-pill:999px;
  --shadow-sm:0 1px 2px rgba(22,22,22,.04),0 1px 4px rgba(22,22,22,.03);
  --shadow-md:0 2px 8px rgba(22,22,22,.06),0 4px 16px rgba(22,22,22,.04);
  --shadow-lg:0 8px 24px rgba(22,22,22,.08),0 16px 48px rgba(22,22,22,.06);
}
:root[data-theme="dark"]{
  --primary:#A56BE4;
  --primary-deep:#C093ED;
  --primary-structure:#8260B4;
  --primary-soft:rgba(138,78,209,.15);
  --canvas:#0F1115;
  --canvas-soft:#12141B;
  --panel:#181A23;
  --hairline:#2A2D38;
  --ink:#F1F3EE;
  --text-secondary:#B1B5AF;
  --text-muted:#939B95;
  --text-placeholder:#747A76;
  --shadow-sm:0 1px 3px rgba(0,0,0,.26);
  --shadow-md:0 4px 18px rgba(0,0,0,.32);
  --shadow-lg:0 16px 48px rgba(0,0,0,.42);
}
select{color-scheme:light}
select option,select optgroup{background:var(--panel);color:var(--ink)}
:root[data-theme="dark"] select{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;scroll-behavior:smooth}
body{
  min-width:320px;min-height:100vh;background:var(--canvas-soft);color:var(--ink);
  font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
}
button,input,select,textarea{font:inherit}
button,a{ -webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid rgba(138,78,209,.22);outline-offset:2px
}

/* Global product frame */
.app-shell{min-height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr)}
.workspace-shell{min-width:0}
.app-sidebar{
  position:sticky;top:0;height:100vh;z-index:60;display:flex;flex-direction:column;gap:18px;
  padding:24px 16px 18px;background:var(--canvas);border-right:1px solid var(--hairline)
}
.global-header{
  height:64px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:0 24px;background:color-mix(in srgb,var(--canvas) 94%,transparent);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--hairline)
}
.brand-lockup{display:flex;align-items:center;gap:11px;min-width:0}
.brand-symbol{width:46px;height:44px;position:relative;flex:0 0 46px}
.brand-symbol i{
  position:absolute;display:block;
  background:linear-gradient(135deg,#4b2db5 8%,#6d32df 55%,#a430f2 100%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.2)
}
.brand-symbol .logo-bar{left:1px;top:2px;width:14px;height:24px;border-radius:6px}
.brand-symbol .logo-diamond{left:29px;top:3px;width:14px;height:14px;border-radius:4px;transform:rotate(45deg)}
.brand-symbol .logo-bridge{left:17px;top:20px;width:27px;height:9px;border-radius:5px}
.brand-symbol .logo-block{left:1px;top:31px;width:14px;height:12px;border-radius:4px}
.brand-symbol .logo-corner{
  left:29px;top:31px;width:16px;height:12px;border-radius:4px;
  clip-path:polygon(0 0,100% 0,100% 100%,42% 100%,42% 62%,0 62%)
}
.brand-copy strong{display:block;color:var(--ink);font-size:18px;font-weight:700;line-height:1.05;letter-spacing:-.025em}
.brand-copy span{display:block;margin-top:5px;color:var(--primary-deep);font-size:12px;font-weight:600;line-height:1;letter-spacing:.12em}
.sidebar-create{width:100%;font-size:16px;font-weight:500}
.sidebar-foot{
  margin-top:auto;display:grid;gap:10px;padding:0;border:0;background:transparent
}
.sidebar-login{
  width:100%;height:42px;display:flex;align-items:center;justify-content:center;border:0;border-radius:var(--r-input);
  background:var(--panel);color:var(--ink);font-size:13px;font-weight:600
}
.sidebar-usage{display:grid!important;grid-template-columns:1fr 1fr;gap:10px!important}
.sidebar-usage>div{padding:8px;border-radius:var(--r-input);background:var(--panel)}
.sidebar-usage .usage-upgrade{
  grid-column:1/-1;width:100%;display:flex;align-items:center;justify-content:flex-start;padding:0 8px;
  font-size:13px;font-weight:600
}
.global-search{
  width:min(680px,60vw);height:44px;display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:8px;
  padding:0 12px;background:var(--canvas-soft);border:1px solid transparent;border-radius:var(--r-button);
  transition:border-color 160ms,background 160ms
}
.global-search:focus-within{background:var(--canvas);border-color:var(--primary)}
.global-search .search-glyph{font-size:18px;color:var(--text-muted);transform:rotate(-15deg)}
.global-search input{min-width:0;border:0;background:transparent;color:var(--ink);outline:0}
.global-search input::placeholder{color:var(--text-placeholder)}
.global-search kbd{
  padding:2px 6px;border:1px solid var(--hairline);border-radius:4px;background:var(--canvas);
  color:var(--text-muted);font:500 10px var(--mono)
}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.icon-button,.user-button{
  width:42px;height:42px;padding:0;border:1px solid var(--hairline);background:var(--canvas);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background 160ms,color 160ms
}
.icon-button{border-radius:var(--r-button)}
.user-button{background:var(--primary-soft);color:var(--primary-deep);font-weight:700}
.icon-button:hover,.user-button:hover{background:var(--primary-soft);color:var(--primary-deep)}
.user-button.sidebar-login{width:100%;height:42px;border:0;border-radius:var(--r-input);font-size:13px;font-weight:600}

/* Primary workspace navigation */
.primary-navigation{
  display:block;padding:4px 0;background:transparent
}
#mainNav{display:grid;gap:4px;min-width:0}
.nav{
  width:100%;height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;
  border:0;border-radius:var(--r-input);background:transparent;color:var(--text-secondary);
  text-decoration:none;font-size:16px;font-weight:500;cursor:pointer;transition:background 160ms,color 160ms
}
.nav svg{width:16px;height:16px}
.nav:hover{background:var(--canvas-soft);color:var(--ink)}
.nav.active{background:var(--primary-soft);color:var(--primary-deep);font-weight:500}
.nav.active svg{color:var(--primary)}
button{
  min-height:44px;padding:0 18px;border:1px solid var(--hairline);border-radius:var(--r-button);
  background:var(--canvas);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;
  transition:background 160ms,border-color 160ms,transform 120ms
}
button:hover{background:var(--canvas-soft)}
button:active{transform:translateY(1px)}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button.primary:hover{background:var(--primary-deep);border-color:var(--primary-deep)}
button.tertiary{border-color:transparent;background:transparent;color:var(--primary-deep)}

.page-shell{width:100%;padding:24px 32px 56px}
.context-bar{
  min-height:60px;display:none;align-items:center;justify-content:space-between;gap:20px;
  padding:0 0 20px;border-bottom:1px solid var(--hairline)
}
.context-left{display:flex;align-items:flex-start;gap:10px;min-width:0}
.scope-cluster{display:flex;min-width:0;flex-direction:column;align-items:flex-start}
.context-caption{margin:5px 0 0 12px;color:var(--text-muted);font:500 10px var(--mono);letter-spacing:.05em}
#scopeList{display:flex;align-items:center;gap:8px;min-width:0}
.scope-item{
  min-height:38px;display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:8px;
  padding:0 12px;border-color:var(--hairline);border-radius:var(--r-button);text-align:left
}
.scope-item svg{width:15px;height:15px}
.scope-item.active{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 40%,var(--hairline));color:var(--primary-deep)}
.scope-count{font:500 10px var(--mono);color:var(--text-muted)}
.create-scope{width:38px;min-height:38px;padding:0;font-size:18px}
.usage-summary{display:flex;align-items:center;gap:20px;color:var(--text-muted);font-size:12px;font-weight:400}
.usage-summary strong{display:block;color:var(--ink);font-family:var(--font);font-size:13px;font-weight:500;line-height:1.2}
.usage-summary span{display:block;margin-top:2px;font-size:12px;font-weight:400}

.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:14px 0 22px}
#viewTitle{font-size:28px;line-height:1.2;letter-spacing:-.02em}
body.overview-view .page-heading,body.library-view .page-heading{display:none}
body.overview-view #view,body.library-view #view{padding-top:4px}

/* Knowledge content is the primary workspace */
.library-index{padding-top:4px}
.library-index-head{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--hairline)}
.library-index-head h2{font-size:20px;font-weight:600}
.library-grid{display:grid;grid-template-columns:1fr;gap:0;margin-top:4px;border-top:1px solid var(--hairline)}
.library-card{
  width:100%;min-height:92px;display:grid;grid-template-columns:minmax(260px,1.15fr) minmax(520px,1.85fr);align-items:center;gap:24px;
  padding:16px 4px;border:0;border-bottom:1px solid var(--hairline);border-radius:0;background:transparent;
  color:var(--ink);box-shadow:none;transition:background 160ms
}
.library-card:hover{background:var(--canvas-soft)}
.library-open{
  width:100%;min-height:40px;display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:12px;
  padding:0;border:0;background:transparent;color:var(--ink);text-align:left
}
.library-open:hover{background:transparent}
.library-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:var(--primary-soft);color:var(--primary)}
.library-icon svg{width:18px;height:18px}
.library-card-main strong,.library-card-main span,.library-count strong,.library-count span{display:block}
.library-card-main strong{font-size:16px;font-weight:500}.library-card-main span{margin-top:4px;color:var(--text-secondary);font-size:12px;font-weight:400;line-height:1.5}
.library-side{
  min-width:0;width:100%;display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:24px
}
.library-count{text-align:center}.library-count strong{font-family:var(--font);font-size:16px;font-weight:500;line-height:1.1}.library-count span{margin-top:2px;color:var(--text-muted);font-size:12px;font-weight:400}
.regenerate-button{
  min-height:34px;padding:0 12px;white-space:nowrap;
  border-color:var(--primary);background:var(--primary);color:#fff
}
.regenerate-button:hover{border-color:var(--primary-deep);background:var(--primary-deep)}
.regenerate-button:disabled{cursor:wait;opacity:.65}
.processing-stats{
  min-width:0;width:100%;display:grid;grid-template-columns:repeat(5,1fr);
  align-items:center;gap:16px
}
.processing-stat{
  min-width:44px;min-height:0;display:block;margin:0;padding:0;border:0;border-radius:0;
  background:transparent;text-align:center
}
.processing-mark{display:none}
.processing-stat strong{display:block;font-family:var(--font);font-size:16px;font-weight:500;line-height:1.1;color:var(--ink)}
.processing-stat>span:last-child{display:block;margin-top:2px;color:var(--text-muted);font-size:12px;font-weight:400;white-space:nowrap}
.library-card .library-card-main strong,
.library-card .processing-stat strong,
.library-card .library-count strong{
  font-family:var(--font)!important;font-size:16px!important;font-weight:500!important;line-height:1.1!important
}
.content-index{min-width:0}
.content-index-toolbar{
  min-height:58px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  border-bottom:1px solid var(--hairline)
}
.content-tabs,.content-tools{display:flex;align-items:center;gap:4px}
.content-tabs button,.content-tools button{
  min-height:40px;padding:0 13px;border:0;border-radius:var(--r-input);background:transparent;color:var(--text-secondary)
}
.content-tabs button.active{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px var(--primary);border-radius:0}
.content-tools button:hover,.content-tabs button:hover{background:var(--primary-soft);color:var(--primary-deep)}
.content-list{margin-top:12px;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--panel);overflow:hidden}
.content-list-head,.content-row{
  display:grid;grid-template-columns:minmax(320px,1.6fr) minmax(180px,.8fr) minmax(120px,.5fr) 110px;
  align-items:center;gap:18px;padding:0 20px
}
.content-list-head{min-height:42px;background:var(--canvas-soft);color:var(--text-muted);font-size:11px;font-weight:600}
.content-row{
  width:100%;min-height:58px;border:0;border-top:1px solid var(--hairline);border-radius:0;background:transparent;
  color:var(--text-secondary);text-align:left;font-size:12px;font-weight:400
}
.content-row:hover{background:var(--canvas-soft)}
.content-name{display:flex;align-items:center;gap:11px;min-width:0;color:var(--ink)}
.content-name svg{width:18px;height:18px;flex:0 0 auto;color:var(--primary)}
.content-name strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.content-state{color:var(--success);font-weight:600}

/* Dashboard */
.dashboard-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.dashboard-head .eyebrow{margin-bottom:7px;color:var(--primary);font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.dashboard-head h2{font-size:22px;line-height:1.25}
.dashboard-head p{margin-top:5px;color:var(--text-secondary);font-size:13px}
.dashboard-actions{display:flex;gap:8px}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.7fr);gap:20px}
.dashboard-card{background:var(--panel);border:1px solid var(--hairline);border-radius:var(--r-card)}
.focus-card{min-height:220px;padding:28px;display:flex;flex-direction:column}
.focus-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.focus-card .label{color:var(--text-muted);font:600 11px var(--mono);letter-spacing:.06em}
.focus-card h3{margin-top:10px;font-size:22px;line-height:1.3}
.focus-card .description{max-width:680px;margin-top:8px;color:var(--text-secondary);font-size:14px}
.health-badge{
  display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:var(--r-pill);
  background:rgba(76,154,114,.12);color:var(--success);font-size:12px;font-weight:600;white-space:nowrap
}
.health-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.focus-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:auto;padding-top:24px;border-top:1px solid var(--hairline)}
.focus-metric{padding:0 20px;border-right:1px solid var(--hairline)}
.focus-metric:first-child{padding-left:0}.focus-metric:last-child{border-right:0}
.focus-metric strong{display:block;font:600 26px/1.2 var(--mono)}
.focus-metric span{display:block;margin-top:5px;color:var(--text-muted);font-size:12px}
.health-card{padding:24px;display:flex;flex-direction:column}
.card-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}
.card-heading h3{font-size:16px}.card-heading button{min-height:32px;padding:0 8px;font-size:11px}
.health-score{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:20px;padding:24px 0}
.score-ring{
  width:92px;aspect-ratio:1;position:relative;display:grid;place-items:center;border-radius:50%;
  background:conic-gradient(var(--primary) 0 100%,var(--hairline) 100%)
}
.score-ring::before{content:"";width:72px;aspect-ratio:1;border-radius:50%;background:var(--panel)}
.score-ring strong{position:absolute;font:600 20px var(--mono)}
.health-copy strong{display:block;font-size:15px}.health-copy span{display:block;margin-top:4px;color:var(--text-secondary);font-size:12px}
.health-check{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--hairline);color:var(--text-secondary);font-size:12px}
.health-check b{color:var(--success);font:600 12px var(--mono)}
.dashboard-lower{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:20px;margin-top:20px}
.list-card{overflow:hidden}
.list-card .card-heading{min-height:60px;padding:0 22px;border-bottom:1px solid var(--hairline)}
.activity-list,.module-list{display:grid}
.activity-row,.module-row{display:grid;align-items:center;gap:14px;min-height:64px;padding:12px 22px;border-bottom:1px solid var(--hairline);transition:background 160ms}
.activity-row{grid-template-columns:36px minmax(0,1fr) auto}.module-row{grid-template-columns:8px minmax(0,1fr) auto}
.activity-row:last-child,.module-row:last-child{border-bottom:0}
.activity-row:hover,.module-row:hover{background:var(--canvas-soft)}
.activity-icon{width:36px;height:36px;border-radius:10px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary)}
.activity-icon svg{width:17px;height:17px}
.activity-main strong,.module-main strong{display:block;font-size:13px}
.activity-main span,.module-main span{display:block;margin-top:3px;color:var(--text-muted);font-size:11px}
.activity-meta,.module-meta{color:var(--text-muted);font:500 11px var(--mono);white-space:nowrap}
.module-dot{width:7px;height:7px;border-radius:2px;background:var(--primary);transform:rotate(45deg)}

/* Shared views */
.view-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
.view-toolbar h2{font-size:20px}.view-toolbar p{margin-top:4px;color:var(--text-muted);font-size:12px}
.toolbar-actions{display:flex;gap:8px}
.upload-zone{
  min-height:360px;display:grid;place-items:center;padding:40px;border:1px dashed color-mix(in srgb,var(--primary) 55%,var(--hairline));
  border-radius:var(--r-card);background:var(--panel);text-align:center;cursor:pointer;transition:background 160ms,border-color 160ms
}
.upload-zone:hover{background:var(--primary-soft);border-color:var(--primary)}
.upload-mark{width:56px;height:56px;margin:0 auto 18px;border-radius:16px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary)}
.upload-mark svg{width:24px;height:24px}
.upload-zone h3{font-size:18px}.upload-zone p{margin-top:7px;color:var(--text-secondary);font-size:13px}
.upload-zone small{display:block;margin-top:18px;color:var(--text-muted);font:500 11px var(--mono)}
.table-wrap{overflow:hidden;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--panel)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:11px 16px;border-bottom:1px solid var(--hairline);background:var(--canvas-soft);color:var(--text-secondary);font-size:12px;font-weight:600}
td{padding:13px 16px;border-bottom:1px solid var(--hairline);font-size:13px}
tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--canvas-soft)}
.td-mono{font:500 11px var(--mono);color:var(--text-muted)}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:var(--r-pill);font-size:11px;font-weight:600}
.tag-success{background:rgba(76,154,114,.12);color:var(--success)}
.tag-primary{background:var(--primary-soft);color:var(--primary-deep)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.card{padding:20px;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--panel)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.card-icon{width:38px;height:38px;border-radius:11px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary)}
.card-icon svg{width:18px;height:18px}.card-title{font-size:15px;font-weight:700}.card-desc{margin-top:5px;color:var(--text-secondary);font-size:12px}
.card-meta{margin-top:16px;color:var(--text-muted);font:500 10px var(--mono)}

/* Parsed knowledge reader */
.reader-toolbar{
  min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:20px;
  margin-bottom:16px;padding:0 2px
}
.reader-toolbar>div{display:flex;align-items:center;gap:10px}.reader-toolbar strong{font-size:18px}
.reader-shell{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.outline-panel,.reader-document{
  border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--panel)
}
.outline-panel{position:sticky;top:128px;max-height:calc(100vh - 156px);overflow:auto;padding:14px}
.outline-title{display:flex;align-items:center;gap:9px;padding:8px 10px 14px;border-bottom:1px solid var(--hairline)}
.outline-title svg{width:18px;height:18px;color:var(--primary)}
.outline-group{padding:8px 0;border-bottom:1px solid var(--hairline)}
.outline-group:last-child{border-bottom:0}
.outline-group summary{
  min-height:40px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:var(--r-input);
  color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;list-style:none
}
.outline-group summary::-webkit-details-marker{display:none}
.outline-group summary::before{content:"›";font-size:17px;line-height:1;transform:rotate(0);transition:transform 140ms}
.outline-group[open] summary::before{transform:rotate(90deg)}
.outline-group summary svg{width:16px;height:16px;color:var(--warning)}
.outline-items{display:grid;gap:3px;margin:3px 0 3px 24px;padding-left:10px;border-left:1px solid var(--hairline)}
.outline-item{
  width:100%;min-height:40px;display:grid;grid-template-columns:17px minmax(0,1fr);align-items:center;gap:9px;
  padding:8px 10px;border:0;border-radius:var(--r-input);background:transparent;color:var(--text-secondary);
  text-align:left;font-size:12px;font-weight:500
}
.outline-item svg{width:15px;height:15px;color:var(--text-muted)}
.outline-item:hover{background:var(--canvas-soft)}
.outline-item.active{background:var(--primary-soft);color:var(--primary-deep);font-weight:600}
.outline-item.active svg{color:var(--primary)}
.reader-document{min-height:720px;padding:42px 48px}
.document-prose{max-width:900px;margin:0 auto;color:var(--ink)}
.document-prose h2{padding-bottom:16px;border-bottom:1px solid var(--hairline);font-size:28px;line-height:1.25;letter-spacing:-.02em}
.document-prose h3{margin:34px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--hairline);font-size:19px}
.document-prose p,.document-prose li{font-size:15px;line-height:1.8;color:var(--text-secondary)}
.document-prose .reader-lead{margin-top:22px;color:var(--ink);font-size:17px;line-height:1.75}
.document-prose ol,.document-prose ul{display:grid;gap:8px;margin:16px 0 0 24px}
.document-prose li strong{color:var(--ink)}
.document-prose blockquote{
  margin-top:22px;padding:20px 22px;border-left:4px solid var(--primary);border-radius:0 var(--r-button) var(--r-button) 0;
  background:var(--primary-soft);color:var(--primary-deep);font-size:20px;line-height:1.55
}
.concept-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.concept-grid>div{padding:18px;border:1px solid var(--hairline);border-radius:var(--r-button);background:var(--canvas-soft)}
.concept-grid strong{display:block;font-size:14px}.concept-grid span{display:block;margin-top:7px;color:var(--text-secondary);font-size:13px;line-height:1.6}
.module-map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:16px}
.module-map>*{display:grid;place-items:center;min-height:58px;padding:8px;border:1px solid var(--hairline);border-radius:var(--r-input);font-size:12px;text-align:center}
.module-map strong{grid-column:1/-1;background:var(--primary-soft);border-color:var(--primary);color:var(--primary-deep);font-size:14px}
.token-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.token-row span{display:flex;align-items:center;gap:9px;padding:11px;border:1px solid var(--hairline);border-radius:var(--r-input);font-size:12px}
.token-row span::before{content:"";width:24px;height:24px;flex:0 0 auto;border:1px solid var(--hairline);border-radius:7px;background:var(--swatch)}

.graph-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.graph-canvas{
  min-height:510px;padding:28px;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--panel);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:16px
}
.graph-node{position:static;align-self:center;justify-self:center;width:min(100%,180px);padding:13px;transform:none;border:1px solid var(--hairline);border-radius:var(--r-button);background:var(--panel);box-shadow:var(--shadow-sm);text-align:center}
.graph-node strong{display:block;font-size:12px}.graph-node span{color:var(--text-muted);font:500 10px var(--mono)}
.graph-node.core{grid-column:2;grid-row:2;border-color:var(--primary);background:var(--primary-soft)}
.graph-node.n1{grid-column:1;grid-row:1}.graph-node.n2{grid-column:2;grid-row:1}.graph-node.n3{grid-column:3;grid-row:1}
.graph-node.n4{grid-column:1;grid-row:2}.graph-node.n5{grid-column:3;grid-row:2}.graph-node.n6{grid-column:1;grid-row:3}
.graph-node.n7{grid-column:2;grid-row:3}.graph-node.n8{grid-column:3;grid-row:3}
.graph-side{padding:22px;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--panel)}
.graph-side h3{font-size:16px;margin-bottom:14px}
.graph-stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--hairline);color:var(--text-secondary);font-size:12px}
.graph-stat:last-child{border-bottom:0}.graph-stat b{color:var(--ink);font:600 12px var(--mono)}
.empty-message{display:none;padding:56px 24px;text-align:center;color:var(--text-muted)}
.empty-message.show{display:block}
.empty-message strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}

/* Cross-library search and cited answers */
.search-query-panel{
  display:grid;gap:18px;padding:24px;border:1px solid var(--hairline);border-radius:var(--r-card);
  background:var(--panel);box-shadow:var(--shadow-sm)
}
.search-query-heading{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:14px}
.search-query-heading>span{
  width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--primary-soft);color:var(--primary)
}
.search-query-heading>span svg{width:20px;height:20px}
.search-query-heading h2{font-size:20px;line-height:1.3}
.search-query-heading p{margin-top:4px;color:var(--text-secondary);font-size:12px}
.knowledge-search-form{
  width:100%;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:10px
}
.knowledge-search-scope{
  min-width:0;width:240px;height:44px;display:grid;grid-template-columns:18px minmax(0,1fr);align-items:center;gap:8px;
  padding:0 12px;border:1px solid var(--hairline);border-radius:var(--r-input);background:var(--panel);color:var(--primary)
}
.knowledge-search-scope svg{width:17px;height:17px}
.knowledge-search-scope select{
  min-width:0;width:100%;height:42px;padding:0 26px 0 0;border:0;outline:0;
  background:transparent;color:var(--ink);font:500 16px/1 var(--font)
}
.knowledge-search-input-row{
  width:min(760px,100%);min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px;
  border:1px solid var(--hairline);border-radius:var(--r-button);background:var(--canvas-soft)
}
.knowledge-search-input-row:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(138,78,209,.14)}
.knowledge-search-input-row input{
  min-width:0;height:44px;padding:0 10px;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px
}
.knowledge-search-input-row input::placeholder{color:var(--text-placeholder)}
.knowledge-search-form button{display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.knowledge-search-form button svg{width:16px;height:16px}
.search-scope-summary{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:var(--text-muted);font-size:10px}
.search-answer-inner,
.search-result-inner{width:min(760px,100%);margin:0 auto}
.search-answer-inner{display:grid;gap:12px}
.search-scope-summary span,.search-scope-summary strong{
  padding:4px 9px;border-radius:var(--r-pill);background:var(--canvas-soft);font-weight:500
}
.search-scope-summary span{background:var(--primary-soft);color:var(--primary-deep)}
.search-empty-state{
  min-height:320px;display:grid;align-content:center;justify-items:center;gap:10px;padding:48px 24px;
  border:1px dashed var(--hairline);border-radius:var(--r-card);background:var(--panel);text-align:center
}
.search-empty-icon{
  width:52px;height:52px;display:grid;place-items:center;margin-bottom:4px;border-radius:16px;
  background:var(--primary-soft);color:var(--primary)
}
.search-empty-icon svg{width:22px;height:22px}
.search-empty-state h2{font-size:20px;line-height:1.4}
.search-empty-state p{max-width:560px;color:var(--text-muted);font-size:13px;line-height:1.7}
.search-empty-examples{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}

/* Product, account, membership and agent surfaces */
body.immersive-view .page-heading{display:none}
body.immersive-view #view{padding-top:4px}
.nav-group{display:grid;gap:4px}

.knowledge-context{
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  margin-bottom:18px;padding:4px 0 14px;border-bottom:1px solid var(--hairline)
}
.knowledge-context-heading{min-width:220px;display:flex;align-items:center;gap:11px}
.knowledge-context-heading .library-icon{width:36px;height:36px}
.knowledge-context-heading .library-icon svg{width:17px;height:17px}
.knowledge-context-heading strong,.knowledge-context-heading div>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.knowledge-context-heading strong{font-size:15px;font-weight:550}
.knowledge-context-heading div>span{max-width:340px;margin-top:3px;color:var(--text-muted);font-size:10px}
.knowledge-context-nav{display:flex;align-items:center;justify-content:flex-end;gap:4px;overflow-x:auto;scrollbar-width:none}
.knowledge-context-nav::-webkit-scrollbar{display:none}
.knowledge-context-nav button{
  min-width:max-content;min-height:38px;display:flex;align-items:center;gap:7px;padding:0 12px;
  border-color:transparent;background:transparent;color:var(--text-secondary);font-size:12px;font-weight:500
}
.knowledge-context-nav button svg{width:15px;height:15px}
.knowledge-context-nav button:hover{background:var(--canvas-soft)}
.knowledge-context-nav button.active{background:var(--primary-soft);color:var(--primary-deep)}

/* Persistent knowledge-library workspace */
.knowledge-workspace{
  min-width:0;display:grid;grid-template-columns:300px minmax(0,1fr);align-items:start;gap:24px
}
.knowledge-content-sidebar{
  position:sticky;top:88px;height:calc(100vh - 112px);min-height:520px;display:grid;
  grid-template-rows:auto auto minmax(0,1fr);overflow:hidden;border:1px solid var(--hairline);
  border-radius:var(--r-card);background:var(--panel)
}
.knowledge-sidebar-head{padding:14px 14px 12px;border-bottom:1px solid var(--hairline)}
.knowledge-back-button{
  width:100%;min-height:42px;display:flex;align-items:center;justify-content:flex-start;gap:10px;
  margin-bottom:14px;padding:0 12px;border-color:var(--hairline);background:var(--canvas-soft);
  color:var(--ink);font-size:16px;font-weight:500
}
.knowledge-back-button:hover{border-color:color-mix(in srgb,var(--primary) 38%,var(--hairline));background:var(--primary-soft);color:var(--primary-deep)}
.knowledge-back-button svg{width:16px;height:16px;flex:0 0 auto;transform:rotate(180deg)}
.knowledge-scope-title{min-width:0;display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:10px}
.knowledge-scope-title .library-icon{width:36px;height:36px}
.knowledge-scope-title .library-icon svg{width:17px;height:17px}
.knowledge-scope-title strong,.knowledge-scope-title div>span{
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.knowledge-scope-title strong{font-size:14px;font-weight:600}
.knowledge-scope-title div>span{margin-top:3px;color:var(--text-muted);font-size:10px}
.knowledge-sidebar-label{
  min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 18px;color:var(--ink);font-size:15px;font-weight:650
}
.knowledge-sidebar-label strong{
  min-width:28px;padding:3px 8px;border-radius:var(--r-pill);background:var(--primary-soft);
  color:var(--primary-deep);font:600 12px var(--mono);text-align:center
}
.knowledge-content-tree{min-height:0;overflow-y:auto;padding:2px 12px 18px;scrollbar-width:thin}
.knowledge-tree-group{padding:14px 0 16px;border-top:1px solid var(--hairline)}
.knowledge-tree-group:first-child{border-top:0}
.knowledge-tree-group h3{
  display:flex;align-items:center;gap:8px;padding:0 10px 10px;color:var(--text-secondary);
  font-size:14px;font-weight:650;line-height:1.45
}
.knowledge-tree-group h3::before{
  width:3px;height:14px;flex:0 0 auto;border-radius:var(--r-pill);background:var(--primary);content:""
}
.knowledge-tree-item{
  width:100%;min-height:46px;display:grid;grid-template-columns:18px minmax(0,1fr);align-items:center;gap:10px;
  padding:9px 12px 9px 18px;border-color:transparent;border-radius:var(--r-input);background:transparent;
  color:var(--text-secondary);text-align:left;font-size:16px;font-weight:500;line-height:1.5
}
.knowledge-tree-item svg{width:17px;height:17px;color:var(--text-muted)}
.knowledge-tree-item span{
  display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2
}
.knowledge-tree-item:hover{background:var(--canvas-soft);color:var(--ink)}
.knowledge-tree-item.active{background:var(--primary-soft);color:var(--primary-deep);font-weight:600}
.knowledge-tree-item.active svg{color:var(--primary)}
.knowledge-main{min-width:0}
.knowledge-main-header{
  min-height:76px;display:flex;align-items:center;justify-content:flex-start;gap:20px;
  margin-bottom:18px;padding:0 0 12px;border-bottom:1px solid var(--hairline)
}
.knowledge-main-heading{min-width:180px}
.knowledge-main-heading span,.knowledge-main-heading strong{display:block}
.knowledge-main-heading span{color:var(--text-muted);font-size:10px}
.knowledge-main-heading strong{
  max-width:420px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:15px;font-weight:600
}
.knowledge-workspace-tabs{
  min-width:0;flex:1;display:flex;align-items:center;justify-content:center;gap:10px;
  margin-right:clamp(72px,11vw,220px);overflow-x:auto;scrollbar-width:none
}
.knowledge-workspace-tabs::-webkit-scrollbar{display:none}
.knowledge-workspace-tabs button{
  min-width:max-content;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;
  border-color:var(--hairline);background:var(--panel);color:var(--text-secondary);
  font-size:16px;font-weight:500
}
.knowledge-workspace-tabs button svg{width:18px;height:18px}
.knowledge-workspace-tabs button:hover{
  border-color:color-mix(in srgb,var(--primary) 42%,var(--hairline));
  background:var(--canvas-soft);color:var(--ink)
}
.knowledge-workspace-tabs button.active{
  border-color:color-mix(in srgb,var(--primary) 58%,var(--hairline));
  background:var(--primary-soft);color:var(--primary-deep)
}
.knowledge-main-view{min-width:0}
.knowledge-main-view .table-wrap{overflow-x:auto}
.knowledge-main-view .table-wrap table{min-width:640px}
.reader-document-standalone{min-height:560px}
body.knowledge-detail-view .page-heading{display:none}
body.knowledge-detail-view #view{padding-top:4px}

/* Keep the knowledge-page toolbar visible while the full document scrolls
   inside the workspace. The scrollbar stays functional but visually hidden. */
@media(min-width:761px){
  body.knowledge-detail-view .workspace-shell{
    height:100vh;display:grid;grid-template-rows:64px minmax(0,1fr);overflow:hidden
  }
  body.knowledge-detail-view .global-header{position:static}
  body.knowledge-detail-view .page-shell{
    height:100%;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);
    overflow:hidden;padding-bottom:24px
  }
  body.knowledge-detail-view #view{height:auto;min-height:0}
  body.knowledge-detail-view .knowledge-workspace{height:100%;min-height:0}
  body.knowledge-detail-view .knowledge-workspace{align-items:stretch}
  body.knowledge-detail-view .knowledge-content-sidebar{
    position:static;top:auto;height:100%;min-height:0
  }
  body.knowledge-detail-view .knowledge-main{
    min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)
  }
  body.knowledge-detail-view .knowledge-main-header{margin-bottom:0}
  body.knowledge-detail-view .knowledge-main-view{
    min-height:0;overflow-y:auto;padding-top:18px;padding-bottom:44px;
    overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none
  }
  body.knowledge-detail-view .knowledge-main-view::-webkit-scrollbar{
    width:0;height:0;display:none
  }
}

@media(min-width:761px) and (max-width:1380px){
  .knowledge-workspace{grid-template-columns:240px minmax(0,1fr);gap:18px}
  .knowledge-main-header{min-height:0;align-items:flex-start;flex-direction:column;gap:10px}
  .knowledge-workspace-tabs{width:100%;justify-content:flex-start;flex-wrap:wrap;margin-right:0;overflow:visible}
}

.account-center-card{position:relative}
.sidebar-account-usage{
  display:grid;gap:11px;padding:14px;border:1px solid color-mix(in srgb,var(--primary) 22%,var(--hairline));
  border-radius:var(--r-card);background:color-mix(in srgb,var(--primary-soft) 48%,var(--panel));box-shadow:var(--shadow-sm)
}
.sidebar-account-usage-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar-account-usage-head strong{font-size:14px;font-weight:650}
.sidebar-account-usage-head button{
  min-height:26px;padding:0;border:0;background:transparent;color:var(--primary-deep);
  font-size:12px;font-weight:600
}
.sidebar-account-quota{display:grid;gap:6px}
.sidebar-account-quota>div{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar-account-quota span{color:var(--text-secondary);font-size:12px}
.sidebar-account-quota b{font:600 12px var(--mono)}
.sidebar-account-quota>i{
  height:5px;overflow:hidden;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--primary) 10%,var(--hairline))
}
.sidebar-account-quota>i>b{display:block;height:100%;border-radius:inherit;background:var(--primary)}
.sidebar-account-quota.storage>i>b{background:color-mix(in srgb,var(--primary) 76%,#2ca86d)}
.sidebar-account-quota.search>i>b{background:color-mix(in srgb,var(--primary) 74%,#e1a528)}
.account-center-trigger{
  width:100%;min-height:56px;display:grid;grid-template-columns:38px minmax(0,1fr) 18px;align-items:center;gap:10px;
  margin-top:10px;padding:12px 8px 6px;border-color:transparent;border-top:1px solid var(--hairline);
  border-radius:0;background:transparent;text-align:left
}
.account-center-trigger:hover,.account-center-trigger[aria-expanded="true"]{background:var(--primary-soft);color:var(--primary-deep)}
.account-avatar{
  width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--primary);color:#fff;
  font-size:14px;font-weight:600;flex:0 0 auto
}
.account-center-copy strong,.account-center-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-center-copy strong{font-size:16px;font-weight:500}.account-center-copy span{margin-top:3px;color:var(--text-muted);font-size:10px;font-weight:400}
.account-chevron{color:var(--text-muted);font-size:18px}
.account-popover{
  position:absolute;left:0;bottom:calc(100% + 10px);z-index:150;width:360px;max-height:calc(100vh - 40px);
  overflow-y:auto;padding:16px;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--panel);
  box-shadow:var(--shadow-lg)
}
.account-popover-identity{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--hairline)}
.account-avatar.large{width:52px;height:52px;border-radius:50%;font-size:17px}
.account-avatar.xl{width:76px;height:76px;border-radius:18px;font-size:26px}
.account-popover-identity strong,.account-popover-identity span{display:block}
.account-popover-identity strong{font-size:18px;font-weight:600}.account-popover-identity span{margin-top:3px;color:var(--text-muted);font-size:12px}
.account-popover-guest{display:grid;justify-items:center;gap:8px;padding:12px;text-align:center}.account-popover-guest p{color:var(--text-muted);font-size:11px}

/* Three-column knowledge workspace */
.app-shell{
  grid-template-columns:252px minmax(0,1fr) 372px;
  transition:grid-template-columns 180ms ease
}
.workspace-shell{min-width:0;overflow:hidden}
.agent-dock{
  position:sticky;top:0;z-index:55;height:100vh;min-width:0;
  border-left:1px solid var(--hairline);background:var(--canvas)
}
.agent-dock-shell{
  height:100%;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
  background:var(--canvas)
}
.agent-dock-head{
  min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--hairline)
}
.agent-dock-identity{min-width:0;display:flex;align-items:center;gap:10px}
.agent-dock-avatar{
  width:38px;height:38px;display:grid;place-items:center;flex:0 0 auto;
  border-radius:11px;background:var(--primary);color:#fff;font-size:14px;font-weight:600
}
.agent-dock-copy{min-width:0}
.agent-dock-copy strong,.agent-dock-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-dock-copy strong{font-size:13px;font-weight:600}
.agent-dock-copy span{margin-top:2px;color:var(--text-muted);font-size:10px}
.agent-dock-actions{display:flex;align-items:center;gap:4px}
.agent-dock-actions button,.agent-dock-expand{
  width:34px;height:34px;display:grid;place-items:center;padding:0;border-color:transparent;background:transparent
}
.agent-dock-actions button svg,.agent-dock-expand svg{width:16px;height:16px}
.agent-dock-context{padding:12px 16px;border-bottom:1px solid var(--hairline);background:var(--canvas-soft)}
.agent-context-label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--text-muted);font-size:10px}
.agent-picker{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:9px}
.agent-picker select{
  width:180px;max-width:100%;height:40px;padding:0 34px 0 12px;border:1px solid var(--hairline);border-radius:8px;
  outline:0;background:var(--canvas);color:var(--ink);font:500 16px/1 var(--font)
}
.agent-context-chip{
  margin-top:8px;display:flex;align-items:center;gap:8px;padding:9px 10px;
  border:1px solid color-mix(in srgb,var(--primary) 24%,var(--hairline));border-radius:10px;
  background:var(--primary-soft);color:var(--primary-deep)
}
.agent-context-chip svg{width:15px;height:15px;flex:0 0 auto}
.agent-context-chip div{min-width:0}
.agent-context-chip strong,.agent-context-chip span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-context-chip strong{font-size:11px}.agent-context-chip span{margin-top:2px;font-size:9px;opacity:.72}
.agent-dock-messages{
  min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:18px 16px;
  overscroll-behavior:contain;scrollbar-width:thin
}
.agent-message{max-width:92%;display:grid;gap:5px}
.agent-message.user{align-self:flex-end}
.agent-message.assistant{align-self:flex-start}
.agent-message-meta{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:9px}
.agent-message.user .agent-message-meta{justify-content:flex-end}
.agent-message-bubble{padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.65}
.agent-message.assistant .agent-message-bubble{border:1px solid var(--hairline);border-top-left-radius:4px;background:var(--panel)}
.agent-message.user .agent-message-bubble{border-top-right-radius:4px;background:var(--primary);color:#fff}
.agent-citations{display:flex;flex-wrap:wrap;gap:5px}
.agent-citations button{
  min-height:24px;padding:0 8px;border-color:var(--hairline);background:var(--canvas);
  color:var(--text-secondary);font-size:9px
}
.agent-citations button svg{width:11px;height:11px;margin-right:4px;vertical-align:-2px}
.agent-empty{margin:auto 0;text-align:center}
.agent-empty span{
  width:48px;height:48px;display:grid;place-items:center;margin:0 auto 12px;border-radius:15px;
  background:var(--primary-soft);color:var(--primary)
}
.agent-empty span svg{width:22px;height:22px}.agent-empty strong{display:block;font-size:14px}
.agent-empty p{max-width:250px;margin:6px auto 0;color:var(--text-muted);font-size:11px;line-height:1.6}
.agent-dock-footer{padding:12px 14px 14px;border-top:1px solid var(--hairline);background:var(--canvas)}
.agent-quick-prompts{display:flex;gap:6px;margin-bottom:9px;overflow-x:auto;scrollbar-width:none}
.agent-quick-prompts::-webkit-scrollbar{display:none}
.agent-quick-prompts button{
  min-width:max-content;min-height:28px;padding:0 9px;border-color:var(--hairline);background:var(--canvas);
  color:var(--text-secondary);font-size:9px
}
.agent-composer{
  min-height:78px;display:grid;grid-template-columns:minmax(0,1fr) 36px;align-items:end;gap:8px;
  padding:9px;border:1px solid var(--hairline);border-radius:13px;background:var(--panel)
}
.agent-composer textarea{
  width:100%;min-height:52px;max-height:120px;resize:none;border:0;outline:0;
  background:transparent;color:var(--ink);font:400 12px/1.55 var(--font)
}
.agent-composer button{width:36px;height:36px;display:grid;place-items:center;padding:0;border-radius:10px}
.agent-composer button svg{width:16px;height:16px}
.agent-dock-footnote{display:flex;justify-content:space-between;gap:8px;margin-top:7px;color:var(--text-muted);font-size:9px}
.agent-dock-footnote button{min-height:20px;padding:0;border:0;background:transparent;color:var(--primary-deep);font-size:9px}
.agent-dock-collapsed-view{height:100%;display:flex;flex-direction:column;align-items:center;padding:15px 8px}
.agent-dock-collapsed-view .agent-dock-expand{background:var(--primary-soft);color:var(--primary)}
.agent-dock-collapsed-view span{margin-top:14px;color:var(--text-muted);font-size:10px;writing-mode:vertical-rl;letter-spacing:.12em}
.agent-dock-launcher{
  position:fixed;right:18px;bottom:18px;z-index:90;display:none;align-items:center;gap:7px;
  min-height:42px;padding:0 14px;border:0;border-radius:999px;background:var(--primary);color:#fff;
  box-shadow:var(--shadow-lg)
}
.agent-dock-launcher svg{width:17px;height:17px}
body.agent-dock-collapsed .app-shell{grid-template-columns:252px minmax(0,1fr) 52px}
body.agent-dock-hidden .app-shell{grid-template-columns:252px minmax(0,1fr)}
body.agent-dock-hidden .agent-dock,body.agent-dock-hidden .agent-dock-launcher{display:none}
.article-page{grid-template-columns:minmax(0,1fr)!important}
.article-toc{display:none!important}

@media(min-width:1121px) and (max-width:1380px){
  .app-shell{grid-template-columns:220px minmax(0,1fr) 340px}
  body.agent-dock-collapsed .app-shell{grid-template-columns:220px minmax(0,1fr) 52px}
  body.agent-dock-hidden .app-shell{grid-template-columns:220px minmax(0,1fr)}
}
@media(min-width:1121px){
  body.agent-dock-open:not(.agent-dock-hidden) .toast{right:396px}
}
@media(max-width:1120px){
  .app-shell{grid-template-columns:220px minmax(0,1fr)}
  body.agent-dock-collapsed .app-shell,body.agent-dock-hidden .app-shell{grid-template-columns:220px minmax(0,1fr)}
  .agent-dock{
    position:fixed;right:0;top:0;width:min(380px,calc(100vw - 56px));height:100dvh;
    transform:translateX(102%);box-shadow:var(--shadow-lg);transition:transform 180ms ease
  }
  body.agent-dock-open:not(.agent-dock-hidden) .agent-dock{transform:translateX(0)}
  body.agent-dock-collapsed:not(.agent-dock-hidden) .agent-dock-launcher{display:flex}
  .global-search{width:min(680px,100%)}
}
@media(max-width:760px){
  .app-shell,body.agent-dock-collapsed .app-shell,body.agent-dock-hidden .app-shell{display:block;grid-template-columns:none}
  .agent-dock{width:100vw;max-width:none}
  .agent-dock-head{padding-top:max(14px,env(safe-area-inset-top))}
  .agent-dock-footer{padding-bottom:max(14px,env(safe-area-inset-bottom))}
}

/* Knowledge pages use rendered Markdown document typography. */
.markdown-body{margin-top:34px;color:var(--ink);font-size:15px;line-height:1.8}
.markdown-body section{margin-top:34px;padding-bottom:30px;border-bottom:1px solid var(--hairline);scroll-margin-top:88px}
.markdown-body section:first-child{margin-top:0}
.markdown-body section:last-child{border-bottom:0}
.markdown-body h2{
  margin:0 0 18px;padding-bottom:10px;border-bottom:1px solid var(--hairline);
  font-size:23px;line-height:1.35;letter-spacing:-.015em
}
.markdown-body h3{margin:28px 0 10px;font-size:18px;line-height:1.5}
.markdown-body p{margin:0 0 14px;color:var(--text-secondary);font-size:15px;line-height:1.85}
.markdown-body ul,.markdown-body ol{margin:0 0 16px;padding-left:26px}
.markdown-body li{margin:8px 0;color:var(--text-secondary);font-size:15px;line-height:1.8}
.markdown-body code{
  display:inline-block;padding:1px 6px;border:1px solid var(--hairline);border-radius:5px;
  background:var(--canvas-soft);color:var(--primary-deep);font:600 12px/1.7 var(--mono)
}
.markdown-body blockquote{
  margin:18px 0;padding:14px 18px;border-left:4px solid var(--primary);border-radius:0 var(--r-input) var(--r-input) 0;
  background:var(--primary-soft);color:var(--text-secondary)
}
.markdown-body blockquote p{margin:4px 0 0}
.markdown-body .markdown-warning{border-left-color:var(--warning);background:var(--warn-bg)}
.markdown-body table{width:100%;margin:16px 0;border-collapse:collapse;border-spacing:0;font-size:14px}
.markdown-body th,.markdown-body td{padding:11px 14px;border:1px solid var(--hairline);text-align:left}
.markdown-body th{background:var(--canvas-soft);font-weight:650}
.markdown-body td{color:var(--text-secondary)}
.markdown-body .concept-grid,.markdown-body .module-map{display:grid;grid-template-columns:1fr;gap:0;margin:16px 0}
.markdown-body .concept-grid>div,.markdown-body .module-map>span{
  padding:11px 0;border:0;border-bottom:1px solid var(--hairline);border-radius:0;background:transparent;text-align:left
}
.markdown-body .concept-grid>div:last-child,.markdown-body .module-map>span:last-child{border-bottom:0}
.markdown-body .concept-grid strong{font-size:14px}
.markdown-body .concept-grid span{font-size:14px;line-height:1.7}
.markdown-body .markdown-sources{list-style:none;padding-left:0}
.markdown-body .markdown-sources li{padding:8px 0;border-bottom:1px solid var(--hairline)}
.markdown-body .markdown-sources li:last-child{border-bottom:0}

/* Unified content typography
   Baseline: knowledge library page — 20/600, 16/500, 12/400. */
:root{
  --type-page-size:20px;
  --type-page-weight:600;
  --type-section-size:16px;
  --type-section-weight:500;
  --type-body-size:12px;
  --type-body-weight:400;
}

/* Agent filters use the same secondary-title typography as library names. */
#view .agent-tabs button{
  min-height:42px;
  padding:0 16px;
  font-size:var(--type-section-size);
  font-weight:var(--type-section-weight);
  line-height:1.4
}
#view .agent-tabs button span{
  font-size:var(--type-body-size);
  font-weight:var(--type-body-weight)
}

/* Main, modal, and dynamically rendered content share one hierarchy. */
#view h2,.account-modal h2{
  font-size:var(--type-page-size);
  font-weight:var(--type-page-weight);
  line-height:1.2;
  letter-spacing:0;
}
#view h3,.account-modal h3{
  font-size:var(--type-section-size);
  font-weight:var(--type-section-weight);
  line-height:1.4;
  letter-spacing:0;
}
#view p,.account-modal p{
  font-size:var(--type-body-size);
  font-weight:var(--type-body-weight);
  line-height:1.5;
  letter-spacing:0;
}

/* Some cards use non-heading elements for their visible secondary titles. */
#view .panel-title,
#view .card-title,
#view .result-item strong{
  font-size:var(--type-section-size);
  font-weight:var(--type-section-weight);
  line-height:1.4;
}

/* Body copy that is not represented by a paragraph element. */
#view .focus-card .description,
#view .markdown-body li,
.account-modal .security-card-grid article span{
  font-size:var(--type-body-size);
  font-weight:var(--type-body-weight);
  line-height:1.5;
}

/* Document sections and a generated answer are secondary, not new page titles. */
#view .answer-card h2,
#view .markdown-body h2{
  font-size:var(--type-section-size);
  font-weight:var(--type-section-weight);
  line-height:1.4;
}

/* Knowledge-page Markdown keeps document hierarchy without introducing a
   second, oversized typography system. */
#view .markdown-body{font-size:var(--type-body-size);line-height:1.5}
#view .markdown-body h2{margin-bottom:14px;padding-bottom:8px}
#view .markdown-body h3{margin-top:24px}
#view .markdown-body table{font-size:var(--type-body-size)}
#view .markdown-body .concept-grid strong,
#view .markdown-body .concept-grid span{font-size:var(--type-body-size)}

/* Prominent, centered page introductions for the four primary workflows. */
#view .import-studio-hero h2{
  font-size:48px;
  text-align:center
}
.import-studio-hero>p{
  text-align:center
}
.agents-header{

}

.agents-header>div>p:last-child{

}
.raw-files-header{

}

  font-size:33px;
  line-height:1.25
}
.raw-files-header>div>p:last-child{
  text-align:center
}
.raw-files-header>button{
  position:absolute;
  top:0;
  right:0
}
.search-query-heading{
  position:relative;
  display:block;
  padding:0 56px;
  text-align:center
}
.search-query-heading>span{
  position:absolute;
  top:50%;
  left:0;
  transform:translateY(-50%)
}
#view .search-query-heading h2{
  font-size:30px;
  line-height:1.3;
  text-align:center
}
.search-query-heading p{
  text-align:center
}

.agent-editor-modal{width:min(540px,100%)}
.agent-editor-form{padding:22px 24px 26px}
.agent-editor-identity{
  grid-template-columns:144px minmax(0,1fr);
  align-items:end
}
.avatar-field>span{
  display:flex;align-items:center;gap:8px
}
.avatar-field>span small{
  padding:2px 7px;border-radius:var(--r-pill);background:var(--primary-soft);
  color:var(--primary-deep);font-size:10px;font-weight:600
}
.agent-avatar-upload-tile{
  position:relative;width:144px;aspect-ratio:1;display:block;overflow:hidden;
  border:1px solid var(--hairline);border-radius:24px;background:var(--primary-soft);
  cursor:pointer
}
.agent-avatar-preview{
  width:100%;height:100%;display:grid;place-items:center;overflow:hidden;
  border-radius:inherit;background:var(--primary-soft);
  color:var(--primary-deep);font-size:36px;font-weight:600
}
.agent-avatar-upload-overlay{
  position:absolute;right:10px;bottom:10px;left:10px;height:34px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid rgba(255,255,255,.68);border-radius:10px;
  background:rgba(20,13,34,.68);color:#fff;font-size:11px;
  box-shadow:0 6px 18px rgba(24,15,39,.18);backdrop-filter:blur(8px)
}
.agent-avatar-upload-overlay svg{width:14px;height:14px}
.agent-avatar-upload-tile:hover .agent-avatar-upload-overlay{background:var(--primary)}
.agent-avatar-upload-tile>input{
  position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)
}
.agent-editor-name-stack{min-width:0;display:grid;align-content:end;gap:8px}
.agent-editor-name-stack>small{
  color:var(--text-muted);font-size:10px;line-height:1.5;text-align:center
}
.agent-avatar-preview img,
.agent-avatar img,
.agent-dock-avatar img{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit
}
.agent-card-identity{
  min-width:0;display:grid;grid-template-columns:88px minmax(0,1fr);
  align-items:center;gap:16px;margin-bottom:0
}
#view .agent-card-identity .agent-avatar.large{
  width:88px;height:88px;margin:0;border-radius:20px
}
.agent-card-main{min-width:0}
.agent-card>.agent-scene-tags{
  min-height:23px;align-items:center;justify-content:flex-start;margin:10px 0
}
.agent-card-main .agent-card-copy h3{font-size:18px;line-height:1.35}
.agent-card-main .agent-card-copy p{margin-top:5px;line-height:1.55}
button.agent-avatar-generate{
  width:100%;height:36px;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:0 12px;border:1px solid var(--hairline);border-radius:var(--r-button);
  background:var(--panel);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer
}
button.agent-avatar-generate{
  border-color:var(--primary);background:var(--primary-soft);color:var(--primary-deep)
}
button.agent-avatar-generate:hover{border-color:var(--primary)}
button.agent-avatar-generate svg{width:15px;height:15px}

@media(max-width:760px){
  #view .import-studio-hero h2{font-size:40.5px}
  #view .agents-header h2,#view .raw-files-header h2{font-size:30px}
  #view .search-query-heading h2{font-size:27px}
  .raw-files-header{padding:0;text-align:center}
  .raw-files-header>button{position:static;margin:16px auto 0}
  .search-query-heading{padding:0}
  .search-query-heading>span{
    top:0;
    left:50%;
    transform:translateX(-50%)
  }
  .agent-editor-identity{grid-template-columns:1fr;align-items:stretch}
  .agent-avatar-upload-tile{width:128px;border-radius:20px}
  .agent-editor-name-stack>small{text-align:left}
  .agent-card-identity{grid-template-columns:72px minmax(0,1fr);gap:12px}
  #view .agent-card-identity .agent-avatar.large{width:72px;height:72px;border-radius:16px}
}

   44px for primary/navigation actions, 36px for compact contextual actions. */
:root{
  --button-height-regular:44px;
  --button-height-compact:36px;
}
button{
  height:var(--button-height-regular)!important;
  min-height:var(--button-height-regular)!important;
  max-height:var(--button-height-regular)!important;
}
button.mini-button,
button.create-scope,
button.scope-item,
.card-heading button,
.content-tabs button,
.content-tools button,
button.regenerate-button,
.sidebar-account-usage-head button,
button.text-button,
.auth-switch button,
.billing-toggle button,
.account-theme-options button,
.agent-tabs button,
.agent-type-filters button,
.agent-actions button,
button.agent-use-button,
button.agent-edit-button,
button.ghost-button,
.agent-dock-actions button,
button.agent-dock-expand,
.agent-citations button,
.agent-quick-prompts button,
.agent-composer button,
.agent-dock-footnote button,
.claim>div button,
.prompt-grid button,
.chat-input button,
.agent-avatar-picker button,
button.agent-avatar-generate,
.search-empty-examples button,
.toc-toolbar button{
  height:var(--button-height-compact)!important;
  min-height:var(--button-height-compact)!important;
  max-height:var(--button-height-compact)!important;
  padding-top:0!important;
  padding-bottom:0!important;
}
.header-actions button.icon-button,
.header-actions button.user-button,
button.account-modal-close{
  width:var(--button-height-regular)!important
}
button.create-scope,
.agent-dock-actions button,
button.agent-dock-expand,
.agent-composer button,
.chat-input button,
.agent-avatar-picker button{
  width:var(--button-height-compact)!important
}
#view .agent-grid{
  grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch
}
#view .agent-create-card{
  align-self:stretch;height:auto;min-height:200px
}
#view .result-list{
  display:grid;grid-template-columns:1fr;align-items:start;gap:12px
}
#view .result-item{

#view .result-item p{

.agent-create-card:focus-visible,

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
