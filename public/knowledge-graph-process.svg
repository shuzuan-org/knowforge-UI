<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" fill="none" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9fc"/>
      <stop offset="1" stop-color="#f3f1f9"/>
    </linearGradient>
    <linearGradient id="nodeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b6fd6"/>
      <stop offset="1" stop-color="#8047CC"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1100" height="420" rx="16" fill="url(#bg)"/>

  <!-- ===== LEFT: Documents ===== -->
  <g filter="url(#cardShadow)">
    <!-- PDF -->
    <rect x="50" y="60" width="100" height="120" rx="8" fill="#fff" stroke="#e0dde8"/>
    <rect x="64" y="76" width="72" height="6" rx="3" fill="#e85d5d" opacity="0.7"/>
    <rect x="64" y="94" width="60" height="4" rx="2" fill="#ece8f3"/>
    <rect x="64" y="106" width="68" height="4" rx="2" fill="#ece8f3"/>
    <rect x="64" y="118" width="52" height="4" rx="2" fill="#ece8f3"/>
    <rect x="64" y="130" width="64" height="4" rx="2" fill="#ece8f3"/>
    <rect x="64" y="142" width="44" height="4" rx="2" fill="#ece8f3"/>
    <text x="100" y="166" text-anchor="middle" font-size="11" fill="#999" font-weight="500">PDF</text>

    <!-- Word -->
    <rect x="95" y="130" width="100" height="120" rx="8" fill="#fff" stroke="#e0dde8"/>
    <rect x="109" y="146" width="72" height="6" rx="3" fill="#4a72c4" opacity="0.7"/>
    <rect x="109" y="164" width="60" height="4" rx="2" fill="#ece8f3"/>
    <rect x="109" y="176" width="68" height="4" rx="2" fill="#ece8f3"/>
    <rect x="109" y="188" width="52" height="4" rx="2" fill="#ece8f3"/>
    <rect x="109" y="200" width="64" height="4" rx="2" fill="#ece8f3"/>
    <rect x="109" y="212" width="44" height="4" rx="2" fill="#ece8f3"/>
    <text x="145" y="236" text-anchor="middle" font-size="11" fill="#999" font-weight="500">Word</text>

    <!-- Web -->
    <rect x="50" y="230" width="100" height="120" rx="8" fill="#fff" stroke="#e0dde8"/>
    <circle cx="64" cy="248" r="3" fill="#f0ad4e"/>
    <circle cx="74" cy="248" r="3" fill="#5cb85c"/>
    <circle cx="84" cy="248" r="3" fill="#d9534f"/>
    <rect x="64" y="262" width="72" height="4" rx="2" fill="#ece8f3"/>
    <rect x="64" y="274" width="60" height="4" rx="2" fill="#ece8f3"/>
    <rect x="64" y="286" width="68" height="4" rx="2" fill="#ece8f3"/>
    <rect x="64" y="298" width="52" height="4" rx="2" fill="#ece8f3"/>
    <rect x="64" y="310" width="40" height="4" rx="2" fill="#ece8f3"/>
    <text x="100" y="336" text-anchor="middle" font-size="11" fill="#999" font-weight="500">Web</text>
  </g>

  <text x="145" y="380" text-anchor="middle" font-size="14" font-weight="600" fill="#8047CC" opacity="0.6">原始资料</text>

  <!-- ===== Arrow 1 ===== -->
  <g opacity="0.4">
    <line x1="220" y1="205" x2="310" y2="205" stroke="#8047CC" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="310,205 302,200 302,210" fill="#8047CC"/>
  </g>

  <!-- ===== MIDDLE: Extraction ===== -->
  <g filter="url(#cardShadow)">
    <rect x="320" y="150" width="130" height="110" rx="14" fill="#fff" stroke="#d4cde8"/>
    <!-- simple graph icon -->
    <circle cx="360" cy="195" r="9" fill="url(#nodeG)" filter="url(#nodeShadow)"/>
    <circle cx="410" cy="180" r="9" fill="url(#nodeG)" filter="url(#nodeShadow)"/>
    <circle cx="410" cy="215" r="9" fill="url(#nodeG)" filter="url(#nodeShadow)"/>
    <line x1="360" y1="195" x2="410" y2="180" stroke="#c4b8e0" stroke-width="2"/>
    <line x1="360" y1="195" x2="410" y2="215" stroke="#c4b8e0" stroke-width="2"/>
    <line x1="410" y1="180" x2="410" y2="215" stroke="#c4b8e0" stroke-width="2"/>
    <text x="385" y="248" text-anchor="middle" font-size="12" fill="#8047CC" font-weight="600">抽取实体与关系</text>
  </g>

  <!-- ===== Arrow 2 ===== -->
  <g opacity="0.4">
    <line x1="450" y1="205" x2="540" y2="205" stroke="#8047CC" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="540,205 532,200 532,210" fill="#8047CC"/>
  </g>

  <!-- ===== RIGHT: Knowledge Graph ===== -->
  <g filter="url(#cardShadow)">
    <rect x="550" y="50" width="500" height="340" rx="14" fill="#fff" stroke="#e0dde8"/>

    <!-- edges (minimal, abstract) -->
    <line x1="700" y1="140" x2="860" y2="110" stroke="#d4cde8" stroke-width="2.5"/>
    <line x1="700" y1="140" x2="680" y2="280" stroke="#d4cde8" stroke-width="2.5"/>
    <line x1="860" y1="110" x2="980" y2="200" stroke="#d4cde8" stroke-width="2.5"/>
    <line x1="680" y1="280" x2="900" y2="290" stroke="#d4cde8" stroke-width="2.5"/>
    <line x1="980" y1="200" x2="900" y2="290" stroke="#d4cde8" stroke-width="2.5"/>

    <!-- nodes (5 abstract, no labels) -->
    <circle cx="700" cy="140" r="22" fill="url(#nodeG)" filter="url(#nodeShadow)"/>
    <circle cx="860" cy="110" r="18" fill="url(#nodeG)" filter="url(#nodeShadow)"/>
    <circle cx="980" cy="200" r="16" fill="url(#nodeG)" filter="url(#nodeShadow)" opacity="0.7"/>
    <circle cx="680" cy="280" r="16" fill="url(#nodeG)" filter="url(#nodeShadow)" opacity="0.7"/>
    <circle cx="900" cy="290" r="20" fill="url(#nodeG)" filter="url(#nodeShadow)"/>

    <!-- subtle pulse on center node -->
    <circle cx="900" cy="290" r="20" fill="none" stroke="#8047CC" stroke-width="1.5" opacity="0.2">
      <animate attributeName="r" values="20;32;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="800" y="365" text-anchor="middle" font-size="14" font-weight="600" fill="#8047CC" opacity="0.6">知识图谱</text>
</svg>
